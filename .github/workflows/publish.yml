name: Publish Feeds

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Cache entries are immutable, so each run saves under its own key and the
      # next run restores the newest by prefix. Losing it only makes a run slower.
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-
      # Exits non-zero when the build holds back, so the Pages upload and deploy
      # are skipped and the last good Feeds stay live. PR runs don't alert.
      - run: npm run build
        env:
          DISCORD_WEBHOOK_URL: ${{ github.event_name != 'pull_request' && secrets.DISCORD_WEBHOOK_URL || '' }}
      # Saved even when the build holds back, so its fetched detail pages aren't lost.
      - if: always() && hashFiles('.state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
